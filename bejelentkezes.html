<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <link rel="stylesheet" href="bej.css">
</head>
<body>
    <div class="container">
        <div class="toggle-buttons">
            <button id="toggle-login">Show Login</button>
            <button id="toggle-register">Show Register</button>
        </div>
        <div class="form-box" id="login-box">
            <h2>USER LOGIN</h2>
            <form>
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit">LOGIN</button>
            </form>
        </div>
        
        <div class="form-box" id="register-box">
            <h2>REGISTER</h2>
            <form>
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <span class="icon">📧</span>
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" placeholder="Password" required>
                </div>
                <button type="submit">REGISTER</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById("toggle-login").addEventListener("click", function() {
            document.getElementById("register-box").classList.remove("active");
            document.getElementById("login-box").classList.add("active");
        });
        document.getElementById("toggle-register").addEventListener("click", function() {
            document.getElementById("login-box").classList.remove("active");
            document.getElementById("register-box").classList.add("active");
        });
    </script>
</body>
</html>
